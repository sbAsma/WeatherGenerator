# config/evaluate/my_compare.yml
verbose: true
image_format: "png"
dpi_val: 300
summary_plots: true

evaluation:
  metrics  : []
  regions: ["global"]
  summary_plots : False # true
  summary_dir: "./plots/"
  plot_ensemble: false #supported: false, "std", "minmax", "members"
  plot_score_maps: false #plot scores on a 2D maps. it slows down score computation 
  print_summary: false #print out score values on screen. it can be verbose
  log_scale: false
  add_grid: true
  score_cards: false
  # fps: 400
  ############################################################################
  # config related to CAMS forecast comparison
  step_hrs: 12  # hours per WG forecast step index; used to convert WG step indices to hours
  regrid_forecast: true
  cams_forecast_filename: "cams_forecast_2022.zarr"  # CAMS forecast Zarr store inside cams_base_dir
  cams_analysis_filename: "cams_analysis_2017_2022_extended.zarr"  # CAMS analysis Zarr store used as ground truth for CAMS forecast RMSE
  cams_stream: "CAMSANALYSIS"  # which stream in the CAMS Zarr store contains the forecast variables to compare with
  #############################################################################
  plot_cams_forecast_comparison: True
  cams_base_dir: "/work/bk1450/b383429/CAMS/"  # Path to CAMS data
  cams_forecast_steps: "all" # Forecast steps to compare with CAMS
  plot_bias_maps: false
  plot_value_maps:  true   # side-by-side global maps of CAMS forecast vs WG prediction
  create_video: false      # assemble per-step frames into per-channel GIF animations
  fps: 2.0                # frames per second for animations
  plot_rmse_curves:  true
  write_scorecard:  True
  rmse_rel_pct_clip: 40   # clip RMSE relative-to-CAMS heatmap colour range to +/- this percent (set null to disable)
  convert_to_ppm: True     # convert kg/kg profile values (co, no, no2, so2, o3) to ppmv before plotting
  color_max_ppb: 200       # cap the colour scale at this value (in ppb) for value & bias maps; keeps animations readable
  #################################################################################

run_ids :
  gfldvon1: # 20fsteps 8 fsteps model
    label: "Layernorm + noise"
    results_base_dir : "./results/gfldvon1/"
    epoch: 0
    rank: 0
    streams:
      CAMSANALYSIS:
        channels: [
          # Surface variables
          'pm2p5', 'pm10', #  'pm1',
          # 'tc_co', 'tc_no', 'tc_no2', 'tc_o3',
          'go3_925', 'no_925', 'no2_925', 'co_925'

          # # Ozone (o3)
          # 'go3_1000', 'go3_925', 'go3_850', 'go3_700', 'go3_600', 'go3_500',
          # 'go3_400', 'go3_300', 'go3_250', 'go3_200', 'go3_150', 'go3_100', 'go3_50',

          # # Nitrogen monoxide (no)
          # 'no_1000', 'no_925', 'no_850', 'no_700', 'no_600', 'no_500',
          # 'no_400', 'no_300', 'no_250', 'no_200', 'no_150', 'no_100', 'no_50',

          # # Nitrogen dioxide (no2)
          # 'no2_1000', 'no2_925', 'no2_850', 'no2_700', 'no2_600', 'no2_500',
          # 'no2_400', 'no2_300', 'no2_250', 'no2_200', 'no2_150', 'no2_100', 'no2_50',

          # # Carbon monoxide (co)
          # 'co_1000', 'co_925', 'co_850', 'co_700', 'co_600', 'co_500',
          # 'co_400', 'co_300', 'co_250', 'co_200', 'co_150', 'co_100', 'co_50',
          ]   # same names as WG
        evaluation:
          forecast_step: "all"
          sample: "all"
        plotting:
          sample: "all"
          forecast_step: "all"
          plot_maps: false
          plot_target: false
          plot_histograms: false
          plot_animations: false
  